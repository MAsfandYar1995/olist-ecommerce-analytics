version: 2

models:

  - name: int_geolocation_deduplicated
    description: "One representative geographic location per ZIP code prefix."

    columns:

      - name: zip_code_prefix
        tests:
          - unique
          - not_null

      - name: latitude
        tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: -90
                max_value: 90

      - name: longitude
        tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: -180
                max_value: 180



  - name: int_customers_enriched
    description: "Customer records enriched with deduplicated geographic coordinates."
    columns:

      - name: customer_id
        tests:
          - unique
          - not_null



  - name: int_sellers_enriched
    description: "Seller records enriched with deduplicated geographic coordinates."

    columns:

      - name: seller_id
        tests:
          - unique
          - not_null


  - name: int_products_enriched
    description: "Product records enriched with English category translations."

    columns:

      - name: product_id
        tests:
          - unique
          - not_null