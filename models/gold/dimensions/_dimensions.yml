version: 2

models:

  - name: dim_date
    description: "Conformed calendar date dimension used across Olist fact tables."

    columns:
      - name: date_key
        description: "Surrogate date key in YYYYMMDD format."
        tests:
          - unique
          - not_null

      - name: date
        description: "Calendar date."
        tests:
          - unique
          - not_null


  - name: dim_customer
    description: "Customer dimension at one row per customer_unique_id, representing a unique customer across multiple orders."

    columns:
      - name: customer_key
        description: "Warehouse surrogate key generated from customer_unique_id."
        tests:
          - unique
          - not_null

      - name: customer_unique_id
        description: "Source identifier representing the same customer across multiple orders."
        tests:
          - unique
          - not_null

      - name: latest_customer_id
        description: "Customer_id associated with the customer's most recent order."
        tests:
          - not_null

      - name: latest_customer_zip_code_prefix
        description: "ZIP code prefix associated with the customer's most recent customer record."

      - name: latest_customer_city
        description: "City associated with the customer's most recent customer record."

      - name: latest_customer_state
        description: "State associated with the customer's most recent customer record."

      - name: latest_latitude
        description: "Latitude associated with the customer's most recent ZIP code prefix."

      - name: latest_longitude
        description: "Longitude associated with the customer's most recent ZIP code prefix."


  - name: dim_product
    description: "Product dimension containing product identifiers, category information, physical attributes, and derived classifications."

    columns:
      - name: product_key
        description: "Warehouse surrogate key for the product."
        tests:
          - unique
          - not_null

      - name: product_id
        description: "Source-system product identifier."
        tests:
          - unique
          - not_null


  - name: dim_seller
    description: "Seller dimension containing seller identifiers and geographic attributes."

    columns:
      - name: seller_key
        description: "Warehouse surrogate key for the seller."
        tests:
          - unique
          - not_null

      - name: seller_id
        description: "Source-system seller identifier."
        tests:
          - unique
          - not_null